[package]
name = "ImageToAscii"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
imageproc = { version = "0.25.0", features = ["rayon"] }
libblur = {version = "0.17.3", features = ["image"]}
ab_glyph = "0.2.28"
eframe = {version="0.31.1", features=["wgpu"] }
egui = "0.31.0"
egui_extras = { version = "0.31.0", features = ["image", "file"] }
egui-notify = "0.19.0"
image = {version = "0.25.2", features = ["png", "jpeg"]}
rfd = "0.15.0"